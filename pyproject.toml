[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voicemem"
version = "0.2.3"
description = "Left-brain/right-brain memory framework with an audio-native perception layer (scene/speaker/emotion)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lang Jiaqi" }]
keywords = ["memory", "voice", "agent", "llm", "speech", "rag"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

# Base dependencies cover memory, audio perception, transport and SDK examples.
# Platform-specific Studio inference dependencies are declared in extras below.
dependencies = [
    "python-dotenv>=1,<2",
    "numpy",
    "openai",
    "httpx>=0.27,<1",     # Cancellable SSE replies without an OpenAI SDK transport.
    "mem0ai",
    # Audio perception and local embeddings.
    "torch",
    "torchaudio",         # Required by FunASR's audio imports.
    "torchvision",
    "transformers>=4.52.3,<6",
    "accelerate",
    "funasr",             # Default streaming ASR.
    "modelscope",         # FunASR model acquisition.
    "sherpa-onnx",        # ONNX VAD, speaker verification and fallback ASR.
    "sentence-transformers",   # Local memory and slot embeddings.
    "soundfile",          # Audio-file decoding beyond PCM WAV.
    "scipy",
    # Web transport and SDK audio examples.
    "fastapi",
    "uvicorn",
    "pydantic",           # HTTP request schemas.
    "websockets>=14",     # Uvicorn WebSockets and Realtime examples.
    "sounddevice",        # Example microphone and speaker I/O.
    "pywebrtc-audio",     # Acoustic echo cancellation in audio examples.
]

[project.optional-dependencies]
studio-cuda = [
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "transformers==4.57.3",
    "qwen-tts==0.1.1",
    "gradio>=5,<6",
    "sentence-transformers==5.7.0",
    "funasr==1.4.14",
    "modelscope==1.39.1",
    "numpy==1.26.4",
    "scipy==1.17.1",
    "huggingface-hub>=0.34,<1",
    "onnxruntime",
]

studio = [
    "transformers==5.16.1",
    "mlx==0.32.2",
    "mlx-audio==0.5.1",
    "mlx-lm",
    "onnxruntime",
    "huggingface-hub>=1.5,<2",
]

rtc = [
    "av>=14",
]

# Optional QLoRA reply adapter support. Weights are downloaded separately with
# scripts/download_models.sh --reply-adapter.
slm = [
    "peft",               # QLoRA adapter loading.
]

# Other optional SDK TTS providers require their own packages, such as piper-tts
# or voxcpm. Training dependencies are documented in finetune/README.md.

[project.urls]
Homepage = "https://github.com/lang-jiaqi/VoiceMem-Studio"
Repository = "https://github.com/lang-jiaqi/VoiceMem-Studio"
Issues = "https://github.com/lang-jiaqi/VoiceMem-Studio/issues"

[tool.setuptools.packages.find]
# Keep the Python helpers used by the SDK's optional Studio speech adapters.
include = ["voicemem*", "studio", "studio.core*", "studio.harness*", "studio.web*"]

# The wheel provides the SDK, its sample audio and runtime prompt files.
# The complete Studio app runs from a repository checkout; do not ship a partial UI.
[tool.setuptools.package-data]
"*" = ["data/*.txt"]
"voicemem" = ["assets/*.wav"]
"studio" = ["prompt/*.md", "prompt/*.json"]
