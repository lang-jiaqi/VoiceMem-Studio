<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#302734">
<title>VoiceMem Studio</title><link rel="stylesheet" href="/ui/pet-mobile.css"></head>
<body>
<main class="pet-page">
  <canvas id="live" hidden aria-label="白藤"></canvas>
  <div class="shade" aria-hidden="true"></div>
  <header class="topbar"><span class="brand">VoiceMem Studio</span><button id="settingsButton" class="icon-button" type="button" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.75l1.1 1.82a2 2 0 0 0 1.66.96l2.13.03 1.28 2.22-1.04 1.85a2 2 0 0 0 0 1.92l1.04 1.85-1.28 2.22-2.13.03a2 2 0 0 0-1.66.96L12 18.43l-1.1-1.82a2 2 0 0 0-1.66-.96l-2.13-.03-1.28-2.22 1.04-1.85a2 2 0 0 0 0-1.92L5.83 7.78l1.28-2.22 2.13-.03a2 2 0 0 0 1.66-.96L12 2.75Z" transform="translate(0 1.4)"/><circle cx="12" cy="12" r="2.7"/></svg></button></header>
  <p id="phase" class="phase-pill" role="status" hidden></p>
  <footer class="controls"><button id="memoryButton" class="secondary-button" type="button">VoiceMem <span id="memoryCount"></span></button><button id="chatButton" class="secondary-button" type="button">对话<span id="chatCount" class="unread" hidden></span></button><button id="talkButton" type="button" aria-pressed="false">开始对话</button></footer>
</main>
<dialog id="chatDialog" class="sheet chat-sheet"><header><h2>对话</h2><button class="close" type="button" data-close="chatDialog" aria-label="关闭">×</button></header><section id="chatMessages" class="chat-messages" aria-live="polite"><p class="chat-empty">开始说话，或输入一条消息。</p></section><p id="partialTranscript" class="partial-transcript" hidden></p><form id="chatForm" class="chat-composer"><input id="message" maxlength="4000" placeholder="输入消息…" aria-label="输入消息" autocomplete="off"><button id="sendButton" type="submit" aria-label="发送">↑</button></form></dialog>
<dialog id="memoryDialog" class="sheet"><header><h2>VoiceMem</h2><button class="close" type="button" data-close="memoryDialog" aria-label="关闭">×</button></header><section><h3>本轮召回</h3><ul id="retrievedMemories"><li>开始对话后显示</li></ul><h3>新入库</h3><ul id="storedMemories"><li>开始对话后显示</li></ul></section></dialog>
<dialog id="settingsDialog" class="sheet"><header><h2>设置</h2><button class="close" type="button" data-close="settingsDialog" aria-label="关闭">×</button></header><section><p class="account">账号 <strong id="accountName"></strong></p><h3>对话偏好</h3><p id="harnessStatus" class="status">正在连接…</p><div id="harnessControls"></div><button id="logoutButton" class="logout" type="button">退出登录</button></section></dialog>
<div id="toast" role="status" hidden></div>
<script>window.VM_PET_ASSET_ROOT=new URL('/pet/',location.href).href;window.VM_PET_PORTRAIT=true;window.VM_PET_MOBILE=true;window.VMUI={notify(message){const n=document.getElementById('toast');n.textContent=message;n.hidden=false;clearTimeout(n._timer);n._timer=setTimeout(()=>n.hidden=true,4500);}};</script>
<script src="/pet/avatar-parameter-controller.js"></script><script src="/pet/avatar-behavior-controller.js"></script><script src="/pet/audio-lip-sync.js"></script><script src="/pet/live2d-renderer.js"></script><script src="/pet/avatar-controller.js"></script>
<script src="/ui/studio-client.js"></script><script src="/ui/pet-mobile.js"></script>
</body></html>
