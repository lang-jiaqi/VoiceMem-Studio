<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoiceMem · 技术空间</title>
<link rel="stylesheet" href="technical.css" />
<link rel="stylesheet" href="ui.css" />
<link rel="stylesheet" href="settings.css?v=20260921-4" />
<script src="ref/memory-graph-data.js"></script>
</head>
<body data-style="technical">
<canvas id="brain-background-canvas" aria-hidden="true"></canvas>
<canvas id="scene-canvas" aria-label="脑部记忆图谱：记忆域导航示意图"></canvas>

<div id="prism-wrap"><div id="prism-layer"></div></div>

<div class="shell">
  <button class="icon-btn sidebar-toggle" id="toggleSide" title="收起对话栏" aria-label="收起对话栏" aria-expanded="true" aria-controls="conversationSidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
  </button>
  <main class="grid">

    <aside class="col col-side" id="conversationSidebar" aria-label="对话">
      <button class="new-conv" id="newConv"><span>+</span><span>New conversation</span></button>
      <div class="conversation-groups">
        <section aria-labelledby="pinnedHeading">
          <h2 class="side-label" id="pinnedHeading">Pinned</h2>
          <ul class="conv-list" id="pinnedList"></ul>
        </section>
        <section aria-labelledby="historyHeading">
          <h2 class="side-label" id="historyHeading">聊天记录</h2>
          <ul class="conv-list" id="convList"></ul>
        </section>
      </div>
      <div class="sidebar-footer">
        <button class="settings-btn" id="settingsBtn" title="对话设置">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 3-1 3-3 1-2 5 2 5 3 1 1 3h6l1-3 3-1 2-5-2-5-3-1-1-3z"/><circle cx="12" cy="12" r="3"/></svg>
          <span>设置</span>
        </button>
      <div class="user-chip">
        <span class="user-avatar">V</span>
        <span>VoiceMem Studio</span>

      </div>
      </div>
    </aside>

    <section class="col col-retrieval">
      <div class="orb-slot" aria-label="液态语音球">
        <div class="orb-visual"><canvas id="liquidOrb" aria-label="液态语音状态动画"></canvas></div>
        <div class="orb-demo" role="group" aria-label="球体动效演示">
          <button type="button" data-orb-state="listening" aria-pressed="false">倾听</button>
          <button type="button" data-orb-state="speaking" aria-pressed="false">说话</button>
          <button type="button" data-orb-state="short-thinking" aria-pressed="false">短思考</button>
          <button type="button" data-orb-state="long-thinking" aria-pressed="false">长思考</button>
        </div>
        <span id="orbPhase" class="orb-phase" role="status">待机</span>
        <span id="orbSupport" class="orb-support" hidden>当前浏览器使用静态球体预览</span>
      </div>
      <div class="perception-glass">
        <section class="asr-block" aria-labelledby="perceptionHeading">
          <div class="label-row">
            <h2 class="label" id="perceptionHeading">本轮感知</h2>
            <button class="start-talk" id="startTalk" type="button" aria-pressed="false">开始对话</button>
            <span class="live-badge" id="liveBadge"><i></i>LIVE</span>
          </div>
      <div class="dock">
        <div class="input-wrap">
          <input id="composer" type="text" placeholder="输入这一轮想说的话…" aria-label="本轮文字输入" autocomplete="off" />
          <div class="listening-bar">
            <span class="bars"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></span>
            <span id="listenHint">正在聆听…</span>
          </div>
          <button class="mic" id="mic" aria-label="语音输入">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
          </button>
          <button class="send" id="send" aria-label="发送">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h13M12 5l7 7-7 7"/></svg>
          </button>
        </div>
      </div>

          <div class="live-echo empty" id="liveEcho">等待你的下一句话…</div>
          <div class="live-echo prev" id="liveEchoPrev"></div>
          <div class="perception-tags" aria-live="polite">
            <span class="perception-tag emotion-tag"><span>情感</span><b id="emotionTag">待识别</b></span>
            <span class="perception-tag"><span>Speaker ID</span><b id="speakerTag">—</b></span>
            <span class="perception-tag"><span>实体</span><b id="entityTag">未匹配</b></span>
            <span class="perception-tag"><span>簇</span><b id="clusterTag">未匹配</b></span>
          </div>
        </section>
        <section class="topk" aria-label="左右脑记忆">
          <div class="topk-scope" id="topkScope">全部记忆域 · 按相似度排序</div>
          <div class="topk-cols">
            <div class="topk-col"><h3>info</h3><div class="mem-stack facts" id="stackFacts"></div></div>
            <div class="topk-col"><h3>emo&amp;persona</h3><div class="mem-stack traits" id="stackTraits"></div></div>
          </div>
        </section>
      </div>
      <section class="airesp" aria-labelledby="responseHeading">
        <h2 class="label" id="responseHeading">模型回复</h2>
        <p class="empty" id="aiEcho" aria-live="polite">回答会同步显示在这里。</p>
      </section>
    </section>

    <section class="col col-stage">
      <div class="switch" role="tablist">
        <button role="tab" id="tabChat" aria-controls="viewChat" aria-selected="true">Chat</button>
        <button role="tab" id="tabSpace" aria-controls="viewSpace" aria-selected="false">Memory Space</button>
      </div>

      <div class="view on" id="viewChat" role="tabpanel" aria-labelledby="tabChat">
        <div class="thread" id="thread"></div>
      </div>

      <div class="view" id="viewSpace" role="tabpanel" aria-labelledby="tabSpace">
        <div class="space">
          <div class="legend">
            <span><i class="swatch" style="background:#7aa2ff"></i>事实与经历</span>
            <span><i class="swatch" style="background:#ff5fa2"></i>情绪</span>
            <span><i class="swatch" style="background:#ff9a3c"></i>偏好</span>
            <span><i class="swatch" style="background:#4ade80"></i>性格</span>
          </div>
          <div class="hint">点击任一记忆域，Top-K 会切换到该域</div>
        </div>
      </div>
    </section>
  </main>
</div>
<script src="prism.js"></script>
<script src="ui.js"></script>
<script src="studio-client.js?v=20260921-4"></script>
<script src="settings.js?v=20260921-4"></script>
<script src="liquid-orb.js"></script>
<script src="technical.js?v=20260921-4"></script>
<script src="memory-scene.js"></script>
</body>
</html>
