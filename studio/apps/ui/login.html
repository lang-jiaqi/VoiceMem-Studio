<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceMem Studio · 登录</title>
<style>
*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 50% 0,#f7f4fc 0,#f4f0f6 45%,#ece8ef 100%);color:#2e2933;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{width:min(100%,390px);padding:38px 32px 26px;border:1px solid #ffffffb8;border-radius:24px;background:#fffffff0;box-shadow:0 24px 70px #51466018}h1{font-size:27px;letter-spacing:-.035em;margin:0 0 28px;text-align:center}label{display:block;margin:17px 0 7px;font-weight:600;font-size:13px}input{width:100%;padding:13px 14px;border:1px solid #d8d2dd;border-radius:11px;background:#fff;font:inherit;outline:none}input:focus{border-color:#8b79a6;box-shadow:0 0 0 3px #8b79a620}button{font:inherit;cursor:pointer}#submit{width:100%;margin-top:26px;padding:13px;border:0;border-radius:11px;background:#56486e;color:white;font-weight:650}#submit:disabled{opacity:.6}#switch{display:block;margin:17px auto 0;background:none;border:0;color:#574778}#error{min-height:21px;color:#b02f4c;font-size:13px;margin-top:10px;text-align:center}
</style>
</head>
<body><main><h1>VoiceMem Studio</h1>
<form id="form"><label for="name">名称</label><input id="name" autocomplete="username" required minlength="2" maxlength="32">
<label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="256">
<button id="submit" type="submit">登录</button></form><button id="switch" type="button">没有账号？注册</button><div id="error" role="alert"></div></main>
<script>
const form=document.getElementById('form'), submit=document.getElementById('submit'), switcher=document.getElementById('switch'), error=document.getElementById('error');
let registering=false;
const destination=()=>matchMedia('(max-width: 760px) and (pointer: coarse)').matches?'/ui/pet-mobile.html':'/';
fetch('/auth/me').then(r=>{if(r.ok)location.replace(destination());}).catch(()=>{});
switcher.onclick=()=>{registering=!registering;submit.textContent=registering?'注册':'登录';switcher.textContent=registering?'已有账号？登录':'没有账号？注册';document.getElementById('password').autocomplete=registering?'new-password':'current-password';error.textContent='';};
form.onsubmit=async event=>{event.preventDefault();submit.disabled=true;error.textContent='';try{const response=await fetch(registering?'/auth/register':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,password:document.getElementById('password').value})});if(!response.ok){const body=await response.json();throw new Error(body.detail||'登录失败');}location.replace(destination());}catch(e){error.textContent=e.message;}finally{submit.disabled=false;}};
</script></body></html>
