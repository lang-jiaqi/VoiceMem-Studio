<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VoiceMem 体验登录</title>
<style>
*{box-sizing:border-box}body{min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;background:#edeaf5;color:#292537;font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{width:min(100%,390px);padding:34px;border-radius:22px;background:#fff;box-shadow:0 18px 60px #4e436c1a}h1{font-size:26px;margin:0 0 6px}p{color:#766f83;margin:0 0 22px}label{display:block;margin:17px 0 7px;font-weight:600}input{width:100%;padding:12px 14px;border:1px solid #d5cfdf;border-radius:10px;font:inherit}button{font:inherit;cursor:pointer}#submit{width:100%;margin-top:24px;padding:12px;border:0;border-radius:10px;background:#4d4169;color:white;font-weight:600}#switch{display:block;margin:15px auto 0;background:none;border:0;color:#574778}#error{min-height:22px;color:#b02f4c;font-size:13px;margin-top:10px}
</style>
</head>
<body><main><h1>VoiceMem 体验</h1><p>用名称和密码进入自己的记忆空间。</p>
<form id="form"><label for="name">名称</label><input id="name" autocomplete="username" required minlength="2" maxlength="32">
<label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required minlength="10" maxlength="256">
<button id="submit" type="submit">登录</button></form><button id="switch" type="button">没有账号？注册体验</button><div id="error" role="alert"></div></main>
<script>
const form=document.getElementById('form'), submit=document.getElementById('submit'), switcher=document.getElementById('switch'), error=document.getElementById('error');
let registering=false;
const destination=()=>matchMedia('(max-width: 760px) and (pointer: coarse)').matches?'/ui/digital.html':'/';
fetch('/auth/me').then(r=>{if(r.ok)location.replace(destination());}).catch(()=>{});
switcher.onclick=()=>{registering=!registering;submit.textContent=registering?'注册并进入':'登录';switcher.textContent=registering?'已有账号？登录':'没有账号？注册体验';document.getElementById('password').autocomplete=registering?'new-password':'current-password';error.textContent='';};
form.onsubmit=async event=>{event.preventDefault();submit.disabled=true;error.textContent='';try{const response=await fetch(registering?'/auth/register':'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('name').value,password:document.getElementById('password').value})});if(!response.ok){const body=await response.json();throw new Error(body.detail||'登录失败');}location.replace(destination());}catch(e){error.textContent=e.message;}finally{submit.disabled=false;}};
</script></body></html>
