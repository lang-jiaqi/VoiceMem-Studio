<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'">
  <title>VoiceMem Studio</title>
  <link rel="stylesheet" href="launcher.css">
</head>
<body>
  <main class="launcher-card">
    <header><div class="brand"><span class="brand-orb"></span><strong>VoiceMem</strong></div><span id="version" class="version"></span></header>
    <div class="launcher-content">
      <section class="intro">
        <div class="orb" aria-hidden="true"></div>
        <h1>连接 Studio</h1>
        <p>连接服务后，选择你喜欢的对话风格。</p>
      </section>
      <form id="connection" class="connection-card">
        <label for="server">服务地址</label>
        <input id="server" type="url" spellcheck="false" placeholder="https://studio.example.com 或 http://127.0.0.1:8787" required>
        <p class="hint">远程服务使用 HTTPS，或通过 SSH 转发连接本地地址。</p>
        <p class="platform-hint" id="platform-hint"></p>
        <details id="docker-options" hidden>
          <summary>本机 Docker</summary>
          <label class="switch-row"><input id="docker" type="checkbox"><span>自动启动已有服务</span></label>
          <div id="project-row" hidden><button id="choose-project" type="button" class="secondary">选择项目</button><span id="project-path">尚未选择</span></div>
        </details>
        <div class="actions"><button type="submit" id="connect" class="primary">连接并选择风格</button><button id="cancel" type="button" class="secondary" disabled>取消</button></div>
        <div id="status" class="status" role="status" aria-live="polite"><span class="dot"></span><span id="message">正在加载配置…</span></div>
      </form>
    </div>
  </main>
  <script src="launcher.js"></script>
</body>
</html>
