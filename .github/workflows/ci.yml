name: Studio regression checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  model-free-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: evals/requirements-ci.txt
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install regression dependencies
        run: python -m pip install -r evals/requirements-ci.txt
      - name: Install locked browser runtime dependencies
        run: npm ci --prefix studio/apps --include=dev --ignore-scripts
      - name: Check package requirements and tracked runtime logs
        run: |
          python -m pip check
          python -c "import subprocess; assert not subprocess.check_output(['git', 'ls-files', '--', 'prompt/logs']), 'Runtime prompt logs must not be tracked'"
          git diff --check
      - name: Run Python regressions
        run: >-
          python -m unittest
          evals.test_stream_lifecycle evals.test_demo_lifecycle evals.test_session_history
          evals.test_memory_delivery evals.test_asr_finish evals.test_short_turns
          evals.test_input_transcript evals.test_public_demo evals.test_reply_text
          evals.test_context_commit evals.test_markdown_speech evals.test_dialogue_harness
          tests.test_session_context
      - name: Run browser regressions
        run: |
          node --test evals/test_markdown_preview.cjs evals/test_mobile_memory_status.cjs
          node evals/test_transcript_ui.cjs
          node evals/test_mobile_avatar_loading.cjs
